name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Published resolution: UV_NO_SOURCES ignores the [tool.uv.sources] editable
    # paths so the committed uv.lock resolves released siblings from PyPI. CI is
    # hermetic — no sibling checkouts. Local dev keeps sources (plain `uv sync`).
    env:
      UV_NO_SOURCES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv python install 3.13
      # dev pulls the test/lint/type tooling; --locked asserts the committed
      # uv.lock is current; --python pins the interpreter.
      - run: uv sync --locked --python 3.13 --extra dev
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing
      - name: Packaged descriptor
        # The wheel is what users install, so build it and assert the plugin
        # descriptor really travels inside it -- at the import path the loader
        # reads, declaring the same version as the project metadata.
        run: |
          set -euo pipefail
          uv build --wheel --out-dir dist
          wheel=$(ls dist/*.whl)
          version=$(uv run --no-sync python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          descriptor=$(unzip -p "$wheel" tai42_accounts_postgres/tai-plugin.yml) || {
            echo "::error::$wheel does not package tai42_accounts_postgres/tai-plugin.yml"
            unzip -l "$wheel"
            exit 1
          }
          printf '%s\n' "$descriptor" | grep -qx "version: $version" || {
            echo "::error::$wheel packages a tai-plugin.yml that does not declare version: $version"
            printf '%s\n' "$descriptor"
            exit 1
          }

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tai-accounts-postgres
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tai-accounts-postgres/pnpm-lock.yaml
      - name: Install deps
        working-directory: tai-accounts-postgres
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: tai-accounts-postgres
        run: pnpm typecheck
      - name: Format check
        working-directory: tai-accounts-postgres
        run: pnpm run format:check
      - name: Test
        working-directory: tai-accounts-postgres
        run: pnpm test
      - name: Build Studio bundle
        working-directory: tai-accounts-postgres
        run: pnpm run build
      # A stale committed bundle fails here: the freshly built output must equal
      # what is checked in.
      - name: Dist freshness
        working-directory: tai-accounts-postgres
        run: git diff --exit-code src/tai42_accounts_postgres/studio/

  # Fleet e2e gate. On push:main and on pull_request, after this repo's own
  # checks pass, dispatch tai-e2e for the tested sha; tai-e2e runs the cross-repo
  # suite and posts a `fleet-e2e` commit status back, which branch protection
  # requires. The dispatch token is a repo Actions secret AND a Dependabot secret
  # so Dependabot PRs dispatch too; a fork PR has neither, so the guarded step
  # skips and the required status stays unset for a maintainer to run.
  trigger-e2e:
    needs: check
    runs-on: ubuntu-latest
    permissions: {}
    env:
      E2E_DISPATCH_TOKEN: ${{ secrets.TAI_E2E_DISPATCH_TOKEN }}
    steps:
      # Build the payload with jq so the branch name (untrusted) is JSON-escaped,
      # never interpolated into a shell or into the payload text.
      - name: Build dispatch payload
        id: payload
        if: env.E2E_DISPATCH_TOKEN != ''
        env:
          SRC_REPO: tai-accounts-postgres
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          LEGS: ""
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg repo "$SRC_REPO" \
            --arg ref "$SHA" \
            --arg ref_name "$REF_NAME" \
            --arg legs "$LEGS" \
            '{repo: $repo, ref: $ref, ref_name: $ref_name} + (if $legs == "" then {} else {legs: $legs} end)')"
          echo "json=$payload" >> "$GITHUB_OUTPUT"
      - name: Dispatch fleet-e2e
        if: env.E2E_DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ env.E2E_DISPATCH_TOKEN }}
          repository: ${{ github.repository_owner }}/tai-e2e
          event-type: fleet-e2e
          client-payload: ${{ steps.payload.outputs.json }}
